<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="新町時刻表" />
  <meta name="theme-color" content="#0a2240" />
  <link rel="icon" href="data:," />
  <title>My時刻表（上野東京ライン）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0f1a; }
    /* スクロールバー非表示（iOS/Android） */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <script>console.log("=== shimmachi v2 loaded ===");</script>
  <script type="text/babel">
const { useState, useEffect, useRef } = React;

let UP_WEEKDAY = [], UP_HOLIDAY = [], DOWN_WEEKDAY = [], DOWN_HOLIDAY = [];

async function loadTimetable() {
  const res = await fetch("timetable.json");
  const data = await res.json();
  UP_WEEKDAY = data.up.weekday;
  UP_HOLIDAY = data.up.holiday;
  DOWN_WEEKDAY = data.down.weekday;
  DOWN_HOLIDAY = data.down.holiday;
}

function toMin(t) {
  if (!t || t.startsWith("翌")) return Infinity;
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}
function openGmaps(timeStr, destination, dayType = "weekday", coords = null) {
  if (!timeStr) return;

  const isNextDay = timeStr.startsWith("翌");
  const cleanTime = isNextDay ? timeStr.slice(1) : timeStr;
  const [h, m] = cleanTime.split(":").map(Number);

  const now = new Date();
  let targetDate;
  if (dayType === "holiday") {
    const day = now.getDay();
    const daysUntilSat = day === 6 ? 0 : (6 - day);
    targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysUntilSat);
  } else {
    targetDate = new Date(now);
  }
  if (isNextDay) targetDate.setDate(targetDate.getDate() + 1);

  const d = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate(), h, m, 0);
  const localUnix = Math.floor(d.getTime() / 1000) + (-now.getTimezoneOffset() * 60);
  const dest = encodeURIComponent(destination);

  console.log("userCoords:", coords);
  const origin = typeof coords === "string" ? encodeURIComponent(coords) : coords ? `${coords.lat},${coords.lng}` : "";
  const url = `https://www.google.com/maps/dir/${origin}/${dest}/data=!4m6!4m5!2m3!6e1!7e2!8j${localUnix}!3e3`;
  console.log("url:", url);
  window.open(url, "_blank");
}
function nowMin() {
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}
function nextIdx(data, key) {
  const now = nowMin();
  for (let i = 0; i < data.length; i++) if (toMin(key(data[i])) >= now) return i;
  return -1;
}

const mono = "'Courier New', monospace";
const sans = "'Hiragino Sans', 'Noto Sans JP', sans-serif";

function thSt() {
  return {
    background: "#0e1f33", color: "#6a94b8", fontWeight: 500,
    padding: "9px 12px", textAlign: "center", fontSize: 11,
    letterSpacing: "0.08em", borderBottom: "2px solid #1a3a55",
    whiteSpace: "nowrap", position: "sticky", top: 0, zIndex: 5,
  };
}
function rowSt(past, next) {
  return {
    background: next ? "rgba(255,200,50,0.11)" : past ? "rgba(255,255,255,0.02)" : "transparent",
    borderBottom: "1px solid rgba(255,255,255,0.04)",
  };
}
function timeSt(past, next, dim) {
  return {
    padding: "9px 12px", fontFamily: mono, fontVariantNumeric: "tabular-nums",
    fontWeight: next && !dim ? 700 : 400, fontSize: dim ? 13 : 15,
    color: past ? "#2d4155" : next ? (dim ? "rgba(255,216,77,0.65)" : "#ffd84d") : (dim ? "rgba(200,216,232,0.45)" : "#e8f4ff"),
    textAlign: "center", whiteSpace: "nowrap",
  };
}
function tdSt(past) {
  return { padding: "9px 12px", color: past ? "#2d4155" : "#c8d8e8", textAlign: "center", whiteSpace: "nowrap" };
}

function App() {
  const [dir, setDir] = useState("down");
  const [dow, setDow] = useState(() => {
    const d = new Date().getDay();
    return d === 0 || d === 6 ? "holiday" : "weekday";
  });
  const [, setTick] = useState(0);
  const [userCoords, setUserCoords] = useState(null);

  useEffect(() => {
    console.log("useEffect[tick] 発火");
    const t = setInterval(() => setTick(v => v + 1), 30000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    console.log("useEffect[geo] 発火: geolocation対応=", !!navigator.geolocation);
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => { console.log("coords取得成功", pos.coords.latitude, pos.coords.longitude); setUserCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
        (err) => { console.log("coords取得失敗", err.code, err.message); setUserCoords(null); },
        { timeout: 10000 }
      );
    }
  }, []);

  const nextRowRef = useRef(null);
  useEffect(() => {
    nextRowRef.current?.scrollIntoView({ behavior: "smooth", block: "center" });
  }, [dir, dow]);

  const upData   = dow === "weekday" ? UP_WEEKDAY   : UP_HOLIDAY;
  const downData = dow === "weekday" ? DOWN_WEEKDAY : DOWN_HOLIDAY;
  const upNext   = nextIdx(upData,   r => r.dep);
  const downNext = nextIdx(downData, r => r.ueno);

  const Btn = ({ active, color, children, onClick }) => (
    <button onClick={onClick} style={{
      padding: "7px 14px", fontSize: 12, fontWeight: active ? 700 : 400,
      cursor: "pointer", background: active ? color : "transparent",
      color: active ? "#fff" : "#6a94b8", border: "none", letterSpacing: "0.04em",
      WebkitTapHighlightColor: "transparent",
    }}>{children}</button>
  );

  return (
    <div style={{ fontFamily: sans, background: "#0b0f1a", height: "100dvh", display: "flex", flexDirection: "column", color: "#c8d8e8" }}>

      {/* ヘッダー */}
      <div style={{
        background: "linear-gradient(135deg,#0e3a5c,#0a2240)",
        borderBottom: "3px solid #1e6fa8",
        padding: "14px 14px 12px",
        flexShrink: 0,
      }}>
        <div style={{ fontSize: 17, fontWeight: 700, color: "#fff", marginBottom: 10 }}>My時刻表（上野東京ライン）</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <div style={{ display: "flex", background: "rgba(255,255,255,0.07)", borderRadius: 8, overflow: "hidden", border: "1px solid rgba(255,255,255,0.12)" }}>
            <Btn active={dir === "up"} color="#1e5a9c" onClick={() => setDir("up")}>▲ 群馬 → 東京</Btn>
            <Btn active={dir === "down"} color="#1e5a9c" onClick={() => setDir("down")}>▼ 東京 → 群馬</Btn>
          </div>
          <div style={{ display: "flex", background: "rgba(255,255,255,0.07)", borderRadius: 8, overflow: "hidden", border: "1px solid rgba(255,255,255,0.12)" }}>
            <Btn active={dow === "weekday"} color="#0e6b44" onClick={() => setDow("weekday")}>平日</Btn>
            <Btn active={dow === "holiday"} color="#0e6b44" onClick={() => setDow("holiday")}>土休日</Btn>
          </div>
        </div>
      </div>

      {/* テーブル（ここだけスクロール） */}
      <div style={{ flex: 1, overflowY: "auto", overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
        {dir === "up" ? (
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr>
                <th style={thSt()}>新町発</th>
                <th style={thSt()}>上野着</th>
                <th style={thSt()}>東京着</th>
              </tr>
            </thead>
            <tbody>
              {upData.map((row, i) => {
                const past = toMin(row.dep) < nowMin();
                const next = i === upNext;
                return (
                  <tr key={i} ref={next ? nextRowRef : null} style={rowSt(past, next)}>
                    <td style={timeSt(past, next, false)}>
                      {next && <span style={{ color: "#ffd84d", marginRight: 4, fontSize: 10 }}>▶</span>}
                      {row.dep}
                    </td>
                    <td style={timeSt(past, next, false)}>
                      {row.ueno
                        ? <span onClick={() => openGmaps(row.ueno, "上野駅", dow, "新町駅 群馬県")} style={{ color: "inherit", textDecoration: "underline", cursor: "pointer" }}>{row.ueno}</span>
                        : <span style={{ color: past ? "#2d4155" : "#3a5570", fontFamily: mono }}>——</span>}
                    </td>
                    <td style={timeSt(past, next, false)}>
                      {row.tokyo
                        ? <span onClick={() => openGmaps(row.tokyo, "東京駅", dow, "新町駅 群馬県")} style={{ color: "inherit", textDecoration: "underline", cursor: "pointer" }}>{row.tokyo}</span>
                        : <span style={{ color: past ? "#2d4155" : "#3a5570", fontFamily: mono }}>——</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        ) : (
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr>
                <th style={thSt()}>東京発</th>
                <th style={thSt()}>上野発</th>
                <th style={thSt()}>種別</th>
                <th style={thSt()}>新町着</th>
              </tr>
            </thead>
            <tbody>
              {downData.map((row, i) => {
                const past = toMin(row.ueno) < nowMin();
                const next = i === downNext;
                return (
                  <tr key={i} ref={next ? nextRowRef : null} style={rowSt(past, next)}>
                    <td style={timeSt(past, next, false)}>
                      {next && !row.origin && <span style={{ color: "#ffd84d", marginRight: 4, fontSize: 10 }}>▶</span>}
                      {row.origin
                        ? <span style={{ color: past ? "#2d4155" : "#5aaff0", fontSize: 11, fontFamily: sans }}>上野始発</span>
                        : row.tokyo}
                    </td>
                    <td style={timeSt(past, next, false)}>
                      {next && row.origin && <span style={{ color: "#ffd84d", marginRight: 4, fontSize: 10 }}>▶</span>}
                      {row.ueno}
                    </td>
                    <td style={tdSt(past)}>
                      <span style={{
                        display: "inline-block", padding: "2px 7px", borderRadius: 4, fontSize: 10, fontWeight: 700,
                        background: row.type === "快速アーバン" ? "#8b3a00" : "rgba(30,80,120,0.5)",
                        color: row.type === "快速アーバン" ? "#ffa05a" : "#6a94b8",
                        border: `1px solid ${row.type === "快速アーバン" ? "#a0440a" : "#2a5070"}`,
                      }}>{row.type}</span>
                    </td>
                    <td style={timeSt(past, next, false)}>
                      {row.arr
                        ? <span onClick={() => openGmaps(row.arr, "新町駅 群馬県", dow, userCoords)} style={{ color: "inherit", textDecoration: "underline", cursor: "pointer" }}>{row.arr}</span>
                        : row.arr}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {/* フッター */}
      <div style={{ fontSize: 10, color: "#3a5570", padding: "8px 14px", flexShrink: 0, borderTop: "1px solid #1a3a55", lineHeight: 1.7 }}>
        ※ 2026年4月改正　上野東京ライン直通のみ（湘南新宿ライン除く）
        {dir === "up" ? "　「——」は上野止まり" : "　東京発は目安（上野の約6分前）"}
      </div>
    </div>
  );
}

loadTimetable().then(() => {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
});
  </script>
</body>
</html>
